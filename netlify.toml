# ── Landing page: noindex via header ──
[[headers]]
  for = "/bankruptcy-lp"
  [headers.values]
    X-Robots-Tag = "noindex"

# ── ملاحظة: أُزيلت قواعد «فرض عدم الشرطة المائلة» (/about/ → /about وأخواتها).
# Netlify يطابق «/about/» و«/about» كمسار واحد، فقاعدة force من المسار إلى نفسه
# تنتج حلقة تحويل لا نهائية (ERR_TOO_MANY_REDIRECTS). كانت هذه القواعد مستترة
# خلف client/public/_redirects ولم تُنفَّذ قط حتى حُذف. الضبط pretty_urls = false
# أعلاه يمنع إضافة الشرطة المائلة أصلاً، فلا حاجة إليها.

# ── CRITICAL: Catch-all returns 404 for unknown routes ──
# All valid pages are pre-rendered as /path/index.html — Netlify auto-serves them.
# Any route that doesn't match a pre-rendered file gets a real 404 response.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

